<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MirrorMarch">
  <meta name="theme-color" content="#121316">
  <title>MirrorMarch — Display Mirroring for Omarchy</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Hidden input for iPad on-screen keyboard input capture -->
  <input type="text" id="virtual-keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <!-- Main Container -->
  <div id="app">
    <!-- AUTH / LOGIN VIEW -->
    <div id="auth-view" class="view">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo-circle">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <h1 class="brand-title">MirrorMarch</h1>
          <p id="brand-subtitle" class="brand-subtitle">Sign in to connect your display</p>
        </div>

        <div id="auth-alert" class="alert hidden"></div>

        <!-- Auth Mode Switcher Tabs -->
        <div class="auth-tabs">
          <button type="button" id="tab-signin" class="tab-btn active">Sign In</button>
          <button type="button" id="tab-signup" class="tab-btn">Create Account</button>
        </div>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="input-email">Username or Email</label>
            <div class="input-wrapper">
              <input type="text" id="input-email" placeholder="username or email" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label for="input-password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="input-password" placeholder="••••••••" required autocomplete="current-password" minlength="6">
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn-primary">
            <span id="btn-login-text" class="btn-text">Connect to Display</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>

        <div class="auth-footer">
          <button type="button" id="btn-toggle-auth" class="btn-text-link">
            Don't have an account? <span class="link-highlight">Create one</span>
          </button>
        </div>
      </div>
    </div>

    <!-- DISPLAY VIEWER VIEW -->
    <div id="viewer-view" class="view hidden">
      <!-- Live Video Canvas -->
      <canvas id="display-canvas"></canvas>

      <!-- Touch ripple feedback layer -->
      <div id="touch-ripple-layer" class="touch-ripple-layer"></div>

      <!-- Waiting / Disconnected Overlay -->
      <div id="display-overlay" class="display-overlay">
        <div class="overlay-spinner"></div>
        <h2 id="overlay-status-title">Connecting to Omarchy...</h2>
        <p id="overlay-status-desc">Make sure the MirrorMarch plugin is active on your PC</p>
      </div>

      <!-- Top Remote Desktop Quick Toolbar (Collapsible) -->
      <div id="remote-toolbar" class="remote-toolbar">
        <div class="remote-toolbar-content">
          <!-- Quick Hyprland Actions -->
          <div class="toolbar-group">
            <button type="button" class="tb-btn tb-btn-action" data-shortcut="launcher" title="Super+Space (Launcher)">
              <span>󰘳</span> Launcher
            </button>
            <button type="button" class="tb-btn tb-btn-action" data-shortcut="terminal" title="Super+Enter (Terminal)">
              <span></span> Terminal
            </button>
            <button type="button" class="tb-btn tb-btn-action" data-shortcut="close" title="Super+W (Close Window)">
              <span></span> Close
            </button>
            <button type="button" class="tb-btn tb-btn-action" data-key="Tab" title="Tab">
              ↹ Tab
            </button>
            <button type="button" class="tb-btn tb-btn-action" data-key="Escape" title="Escape">
              ⎋ Esc
            </button>
            <button type="button" id="btn-paste-clipboard" class="tb-btn tb-btn-action" title="Paste Clipboard Text">
              <span>📋</span> Paste
            </button>
          </div>

          <div class="toolbar-divider"></div>

          <!-- Modifiers (Latched) -->
          <div class="toolbar-group">
            <button type="button" class="tb-btn tb-btn-mod" data-mod="super" title="Super / Logo Key">Super</button>
            <button type="button" class="tb-btn tb-btn-mod" data-mod="ctrl" title="Control Key">Ctrl</button>
            <button type="button" class="tb-btn tb-btn-mod" data-mod="alt" title="Alt Key">Alt</button>
            <button type="button" class="tb-btn tb-btn-mod" data-mod="shift" title="Shift Key">Shift</button>
          </div>

          <div class="toolbar-divider"></div>

          <!-- Mouse & Touch Actions -->
          <div class="toolbar-group">
            <button type="button" id="btn-mouse-right" class="tb-btn tb-btn-tool" title="Perform Right Click">
              Right Click
            </button>
            <button type="button" id="btn-drag-mode" class="tb-btn tb-btn-tool" title="Toggle Drag & Select Mode">
              Drag Mode: OFF
            </button>
          </div>
        </div>

        <!-- Pull handle for toolbar toggle -->
        <button type="button" id="tb-pull-handle" class="tb-pull-handle" title="Toggle Remote Desktop Bar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>

      <!-- Floating HUD / Control Bar (Auto-hiding) -->
      <div id="hud-bar" class="hud-bar">
        <div class="hud-status">
          <span id="hud-dot" class="status-dot"></span>
          <span id="hud-title" class="hud-text">MirrorMarch</span>
          <span id="hud-stats" class="hud-badge">30 FPS • 12ms</span>
          <span id="hud-mode-badge" class="hud-mode-badge">Remote</span>
        </div>

        <div class="hud-controls">
          <!-- Touch Mode Toggle -->
          <button id="btn-mode-toggle" class="hud-btn" title="Toggle Touch / Trackpad Mode">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span id="mode-text">Direct Touch</span>
          </button>

          <!-- Quality / Performance Preset Selector -->
          <button id="btn-quality-toggle" class="hud-btn" title="Stream Performance Preset">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span id="quality-text">Balanced</span>
          </button>

          <!-- Virtual Keyboard Toggle -->
          <button id="btn-keyboard-toggle" class="hud-btn" title="Virtual Keyboard">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
            <span>Keyboard</span>
          </button>

          <!-- Fullscreen Toggle -->
          <button id="btn-fullscreen" class="hud-btn" title="Fullscreen">
            <svg id="icon-fs-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            <svg id="icon-fs-exit" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
          </button>

          <!-- Logout / Disconnect -->
          <button id="btn-logout" class="hud-btn hud-btn-danger" title="Disconnect">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
